# Nginx reverse proxy configuration for the LuckyDraw lottery app.
#
# INSTALLATION:
#   sudo cp deployment/nginx.conf /etc/nginx/sites-available/lottery
#   sudo ln -s /etc/nginx/sites-available/lottery /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# After installing Certbot/Let's Encrypt, run:
#   sudo certbot --nginx -d reelsmx.fun -d www.reelsmx.fun
# Certbot will automatically add the SSL/redirect blocks below.

server {
    listen 80;
    server_name reelsmx.fun www.reelsmx.fun;

    # --- Logging ---
    access_log /var/log/nginx/lottery_access.log;
    error_log  /var/log/nginx/lottery_error.log;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Increase body limit for file uploads (screenshot uploads) ---
    client_max_body_size 10M;

    # --- Proxy all traffic to Node.js ---
    # The Node.js server serves both the React frontend (static files from
    # frontend/dist) and the Express API (/api/*) on the same port.
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Required for Socket.io WebSocket upgrade.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        # Timeouts — increase for long-running SSE / Socket.io connections.
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }
}
